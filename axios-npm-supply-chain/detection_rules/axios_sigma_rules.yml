title: C2 Contact to sfrclak.com on Non-Standard Port 8000
id: 3a4b5c6d-0006-4e1f-a1b2-c3d4e5f60606
status: experimental
description: Detects outbound HTTP connections to the known C2 infrastructure (sfrclak.com / 142.11.206.73) on port 8000 — the Axios RAT beaconing endpoint. Also covers backup domain callnrwise.com.
author: Caldera Threat Emulations
date: 2026-03-31
tags:
  - attack.t1104
  - attack.t1571
  - axios
logsource:
  product: windows
  service: network_connection
detection:
  selection:
    DestinationHostname|contains:
      - 'sfrclak.com'
      - 'callnrwise.com'
    DestinationPort: 8000
  condition: selection
level: critical
falsepositives:
  - None — these domains are exclusively C2 infrastructure
fields:
  - DestinationHostname
  - DestinationAddress
  - DestinationPort
  - Image
---
title: Suspicious IE8 User-Agent on Non-Standard Port
id: 3a4b5c6d-0007-4e1f-a1b2-c3d4e5f60707
status: experimental
description: Detects the fake IE8 User-Agent used by the Axios RAT across all campaigns — mozilla/4.0 (compatible; msie 8.0; windows nt 5.1; trident/4.0) — used to beacon on port 8000 and fetch payloads. Consistent OPSEC fingerprint across BlueNoroff campaigns.
author: Caldera Threat Emulations
date: 2026-03-31
tags:
  - attack.t1071.001
  - axios
  - bluenoroff
logsource:
  product: windows
  service: network_connection
detection:
  selection:
    UserAgent|contains: 'mozilla/4.0 (compatible; msie 8.0; windows nt 5.1; trident/4.0)'
  condition: selection
level: high
falsepositives:
  - Legacy internal web applications requiring IE8 compatibility mode
fields:
  - Image
  - UserAgent
  - DestinationHostname
  - DestinationPort
