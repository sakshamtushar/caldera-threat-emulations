id: 3a4b5c6d-0005-4e1f-a1b2-c3d4e5f60505
status: experimental
description: Detects the XOR decryption key signature 'OrDeR_7077' used in the plain-crypto-js dropper's two-layer obfuscation — XOR + Base64 encoding in the setup.js RAT dropper.
