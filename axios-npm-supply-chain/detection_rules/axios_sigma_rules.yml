title: Suspicious npm postinstall Script Execution
id: 3a4b5c6d-0001-4e1f-a1b2-c3d4e5f60101
status: experimental
description: Detects execution of npm package postinstall scripts referencing external URLs or script interpreters — the delivery mechanism for the Axios supply chain RAT dropper (plain-crypto-js/setup.js).
author: Caldera Threat Emulations
date: 2026-03-31
tags:
  - attack.t1195.002
  - attack.supply_chain
  - axios
logsource:
  product: windows
  service: powershell
detection:
  selection:
    EventID: 4104
    Payload|contains:
      - 'postinstall'
      - 'setup.js'
      - 'plain-crypto-js'
      - 'curl'
      - 'wget'
  keywords:
    - '*node*postinstall*'
    - '*npm_config_scripts_prepare*'
  condition: selection
level: high
falsepositives:
  - Legitimate npm packages with postinstall scripts from trusted vendors
references:
  - https://www.sans.org/blog/axios-npm-supply-chain-compromise-malicious-packages-remote-access-trojan
  - https://strobes.co/blog/axios-npm-supply-chain-attack-compromised-rat-2026/
---
title: Compromised axios npm Package Version Detected
id: 3a4b5c6d-0002-4e1f-a1b2-c3d4e5f60202
status: experimental
description: Alerts when a node_modules or project dependency resolves to a known-compromised axios version (1.14.1 or 0.30.4) or the malicious plain-crypto-js transitive dependency.
author: Caldera Threat Emulations
date: 2026-03-31
tags:
  - attack.t1195.002
  - axios
logsource:
  product: windows
  service: application
  category: package_event
detection:
  selection:
    PackageName|contains:
      - 'axios@1.14.1'
      - 'axios@0.30.4'
      - 'plain-crypto-js@4.2.1'
  condition: selection
level: critical
falsepositives:
  - None — any match requires immediate investigation
references:
  - https://gist.github.com/N3mes1s/0c0fc7a0c23cdb5e1c8f66b208053ed6
---
title: RAT Binary Dropped to ProgramData (wt.exe)
id: 3a4b5c6d-0003-4e1f-a1b2-c3d4e5f60303
status: experimental
description: Detects the Windows RAT staging artifact — a binary written to %PROGRAMDATA% named wt.exe (disguised as Windows Terminal) as seen in the Axios supply chain compromise.
author: Caldera Threat Emulations
date: 2026-03-31
tags:
  - attack.t1105
  - attack.t1059.001
  - axios
logsource:
  product: windows
  service: file_event
detection:
  selection:
    TargetFilename|contains: '\ProgramData\wt.exe'
    Image|contains:
      - 'powershell'
      - 'cmd.exe'
      - 'wscript'
  condition: selection
level: high
falsepositives:
  - Legitimate Windows Terminal executable in standard path
fields:
  - TargetFilename
  - Image
  - User
---
title: MicrosoftUpdate Registry Run Key Persistence
id: 3a4b5c6d-0004-4e1f-a1b2-c3d4e5f60404
status: experimental
description: Detects persistence via the MicrosoftUpdate Run key — the exact registry path used by the Axios RAT to survive reboots, masquerading as a legitimate Windows Update component.
author: Caldera Threat Emulations
date: 2026-03-31
tags:
  - attack.t1547.001
  - axios
logsource:
  product: windows
  service: registry_event
detection:
  selection:
    TargetObject|contains: 'MicrosoftUpdate'
    TargetObject|contains:
      - 'CurrentVersion\Run'
      - 'Windows\CurrentVersion\Run'
  condition: selection
level: high
falsepositives:
  - None — MicrosoftUpdate in Run key is highly anomalous
fields:
  - TargetObject
  - Image
  - Details
---
