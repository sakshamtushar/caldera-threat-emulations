title: RAT Artifact Deletion (fs.unlinkSync / self-delete)
id: 3a4b5c6d-0008-4e1f-a1b2-c3d4e5f60808
status: experimental
description: Detects the anti-forensics self-delete behavior of the Axios RAT dropper — fs.unlinkSync in Node.js context, or PowerShell Remove-Item / CMD del targeting npm/node staging directories immediately after postinstall script execution.
author: Caldera Threat Emulations
date: 2026-03-31
tags:
  - attack.t1070.004
  - axios
logsource:
  product: windows
  service: file_event
detection:
  selection:
    TargetFilename|contains:
      - 'setup.js'
      - '6202033.vbs'
      - '6202033.ps1'
      - 'wt.exe'
    Image|contains:
      - 'node'
      - 'powershell'
      - 'cmd.exe'
  condition: selection
level: medium
falsepositives:
  - Legitimate package cleanup scripts
fields:
  - TargetFilename
  - Image
  - User
