description: |
  Emulates the Axios npm supply chain compromise (March 30-31, 2026) conducted
  by BlueNoroff (Lazarus subgroup / DPRK). Threat actors compromised the npm
  account of lead axios maintainer jasonsaayman via a long-lived access token,
  then published malicious versions axios@1.14.1 (latest) and axios@0.30.4 (legacy)
  that introduced a malicious transitive dependency: plain-crypto-js@4.2.1.

  This emulation reproduces the Windows RAT delivery and C2 phases observed in
  the attack — supply chain reconnaissance, RAT download via C2 (sfrclak.com:8000),
  execution and persistence (wt.exe + MicrosoftUpdate registry key), anti-forensics
  artifact deletion, and C2 beacon simulation.

