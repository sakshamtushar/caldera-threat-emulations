# Raccoon Stealer - Browser Extension Wallet Discovery

- id: a1b2c3d4-eeee-4a5b-8c9d-e0f1a2b3c4d5
  name: raccoon-browser-extension-wallet-discovery
  description: |
    Raccoon Stealer searches for cryptocurrency browser extension wallets
    like MetaMask, Coinbase Wallet, Phantom, and others.
  tactic: collection
  technique:
    attack_id: T1005
    name: Data from Local System
  platforms:
    windows:
      psh:
        command: |
          Write-Output "[*] Searching for cryptocurrency browser extension wallets..."
          
          # Chrome extension IDs for crypto wallets (Raccoon targets these)
          $chromeExtensions = @{
            "MetaMask" = "nkbihfbeogaeaoehlefnkodbefgpgknn"
            "Coinbase" = "hnfanknocfeofbddgcijnmhnfnkdnaad"
            "Phantom" = "bfnaelmomeimhlpmgjnjophhpkkoljpa"
            "TronLink" = "ibnejdfjmmkpcnlpebklmnkoeoihofec"
            "Binance Chain" = "fhbohimaelbohpjbbldcngcnapndodjp"
            "Ronin" = "fnjhmkhhmkbjkkabndcnnogagogbneec"
            "XDEFI" = "hmeobnfnfcmdkdcmlblgagmfpfboieaf"
            "Rabby" = "acmacodkjbdgmoleebolmdjonilkdbch"
            "Brave Wallet" = "odbfpeeihdkbihmopkbjmoonfanlbfcl"
            "MEW CX" = "nlbmnnijcnlegkjjpcfjclmcfggfefdm"
            "Solflare" = "bhhhlbepdkbapadjdnnojkbgioiodbic"
            "Keplr" = "dmkamcknogkgcdfhhbddcghachkejeap"
            "Terra Station" = "aiifbnbfobpmeekipheeijimdpnlpgpp"
            "TON" = "nphplpgoakhhjchkkhmiggakijnkhfnd"
          }
          
          $chromeExtPath = "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Local Extension Settings"
          $edgeExtPath = "$env:LOCALAPPDATA\Microsoft\Edge\User Data\Default\Local Extension Settings"
          
          $foundExtensions = @()
          
          # Check Chrome extensions
          Write-Output "`n[*] Checking Chrome extensions..."
          if (Test-Path $chromeExtPath) {
            foreach ($ext in $chromeExtensions.Keys) {
              $extPath = Join-Path $chromeExtPath $chromeExtensions[$ext]
              if (Test-Path $extPath) {
                Write-Output "[+] Chrome: $ext wallet extension found"
                Write-Output "    Path: $extPath"
                $foundExtensions += "Chrome-$ext"
              }
            }
          }
          
          # Check Edge extensions
          Write-Output "`n[*] Checking Edge extensions..."
          if (Test-Path $edgeExtPath) {
            foreach ($ext in $chromeExtensions.Keys) {
              $extPath = Join-Path $edgeExtPath $chromeExtensions[$ext]
              if (Test-Path $extPath) {
                Write-Output "[+] Edge: $ext wallet extension found"
                Write-Output "    Path: $extPath"
                $foundExtensions += "Edge-$ext"
              }
            }
          }
          
          Write-Output "`n[*] Total wallet extensions found: $($foundExtensions.Count)"
  singleton: true
  requirements: []
