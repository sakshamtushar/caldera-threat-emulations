id: cf3a4b5c-6789-abcd-ef01-234567890123
status: experimental
description: Detects creation of System info.txt file in temp directory, characteristic of Raccoon Stealer
references:
    - https://attack.mitre.org/software/S1148/
author: Threat Emulation Team
date: 2024/01/15
tags:
    - attack.collection
    - attack.t1560
