# Raccoon Stealer Detection Rules (Sigma Format)
# For use with SIEM platforms

title: Raccoon Stealer - MachineGuid Registry Access
id: 7a8b9c0d-1234-5678-9abc-def012345678
status: experimental
description: Detects access to the MachineGuid registry key, commonly accessed by Raccoon Stealer for host fingerprinting
references:
    - https://attack.mitre.org/software/S1148/
    - https://blog.sekoia.io/raccoon-stealer-v2-part-2-in-depth-analysis/
author: Threat Emulation Team
date: 2024/01/15
tags:
    - attack.discovery
    - attack.t1012
logsource:
    category: registry_access
    product: windows
detection:
    selection:
        TargetObject|contains: '\SOFTWARE\Microsoft\Cryptography'
        TargetObject|endswith: 'MachineGuid'
    filter:
        Image|endswith:
            - '\svchost.exe'
            - '\services.exe'
            - '\msiexec.exe'
    condition: selection and not filter
falsepositives:
    - Legitimate software checking system identity
    - System management tools
level: medium

---
title: Raccoon Stealer - Browser Credential File Access
id: 8b9c0d1e-2345-6789-abcd-ef0123456789
status: experimental
description: Detects access to browser credential storage files commonly targeted by Raccoon Stealer
references:
    - https://attack.mitre.org/techniques/T1555/003/
author: Threat Emulation Team
date: 2024/01/15
tags:
    - attack.credential-access
    - attack.t1555.003
logsource:
    category: file_access
    product: windows
detection:
    chrome_creds:
        TargetFilename|contains:
            - '\Google\Chrome\User Data\'
        TargetFilename|endswith:
            - '\Login Data'
            - '\Cookies'
            - '\Web Data'
    firefox_creds:
        TargetFilename|contains: '\Mozilla\Firefox\Profiles\'
        TargetFilename|endswith:
            - '\logins.json'
            - '\cookies.sqlite'
            - '\key4.db'
    edge_creds:
        TargetFilename|contains: '\Microsoft\Edge\User Data\'
        TargetFilename|endswith:
            - '\Login Data'
            - '\Cookies'
    filter:
        Image|endswith:
            - '\chrome.exe'
            - '\firefox.exe'
            - '\msedge.exe'
    condition: (chrome_creds or firefox_creds or edge_creds) and not filter
falsepositives:
    - Legitimate browser password managers
    - Backup software
level: high

---
title: Raccoon Stealer - Cryptocurrency Wallet Discovery
id: 9c0d1e2f-3456-789a-bcde-f01234567890
status: experimental
description: Detects file access patterns consistent with cryptocurrency wallet theft by Raccoon Stealer
references:
    - https://attack.mitre.org/software/S1148/
author: Threat Emulation Team
date: 2024/01/15
tags:
    - attack.collection
    - attack.t1005
logsource:
    category: file_access
    product: windows
detection:
    wallet_access:
        TargetFilename|contains:
            - '\Exodus\exodus.wallet'
            - '\atomic\Local Storage'
            - '\Electrum\wallets'
            - '\Coinomi\Coinomi\wallets'
            - '\Monero\wallets'
            - '\WalletWasabi\Client\Wallets'
    wallet_dat:
        TargetFilename|endswith: '\wallet.dat'
    browser_extension_wallets:
        TargetFilename|contains: '\Local Extension Settings\'
        TargetFilename|contains:
            - 'nkbihfbeogaeaoehlefnkodbefgpgknn'  # MetaMask
            - 'bfnaelmomeimhlpmgjnjophhpkkoljpa'  # Phantom
            - 'fhbohimaelbohpjbbldcngcnapndodjp'  # Binance Chain
    condition: wallet_access or wallet_dat or browser_extension_wallets
falsepositives:
    - Legitimate wallet software operations
    - Cryptocurrency trading applications
level: high

