---
title: Raccoon Stealer - DLL Loading Pattern
id: d04b5c6d-789a-bcde-f012-345678901234
status: experimental
description: Detects loading of sqlite3.dll and nss3.dll by non-browser processes, indicating potential Raccoon Stealer activity
references:
    - https://attack.mitre.org/techniques/T1105/
author: Threat Emulation Team
date: 2024/01/15
tags:
    - attack.command-and-control
    - attack.t1105
logsource:
    category: image_load
    product: windows
detection:
    selection:
        ImageLoaded|endswith:
            - '\sqlite3.dll'
            - '\nss3.dll'
            - '\mozglue.dll'
    filter:
        Image|endswith:
            - '\firefox.exe'
            - '\thunderbird.exe'
            - '\chrome.exe'
            - '\msedge.exe'
    condition: selection and not filter
falsepositives:
    - Applications using SQLite database
    - Mozilla-based applications
level: medium
